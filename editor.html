ea><p class="markdown-note">支持 Markdown。图片：<code>![描述](图片链接)</code>；视频：<code>@[video](MP4 链接)</code>；YouTube：<code>@[youtube](链接)</code>。</p></div><div><label for="token">GITHUB FINE-GRAINED TOKEN *</label><input id="token" type="password" autocomplete="off" required placeholder="github_pat_…" /></div><button class="publish" type="submit">PUBLISH_TO_GITHUB →</button><p id="publish-status" class="publish-status" role="status"></p></form></main><script src="editor.js"></script></body></html>
